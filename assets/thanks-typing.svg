<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 420 68'
    style='background-color: #00000000;'
    width='420px' height='68px'>

    <style>
@font-face {
  font-family: 'Roboto Slab';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='4800ms' fill='remove'
                    values='m0,34 h0 ; m0,34 h420 ; m0,34 h420 ; m0,34 h0' keyTimes='0;0.3;0.925;1' />
                    </path>
    <text font-family='"Roboto Slab", monospace' fill='#A981F5' font-size='32'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Thanks for your visit!
        </textPath>
    </text>
</svg>
