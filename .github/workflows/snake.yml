name: Refresh daily profile

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test daily content handling
        run: python3 -m unittest discover -s tests -p 'test_daily_profile.py'
      - name: Refresh inspiration, trivia and public push timing
        run: python3 tools/refresh_daily_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Animate the existing contribution grid
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Khalil-Work
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7544b5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#bd9bff
      - name: Publish generated assets to output branch
        run: python3 tools/publish_profile_output.py
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
